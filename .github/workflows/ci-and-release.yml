name: RiVibe CI, PWA Deploy & Android APK Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  verify-web:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-artifact@v4
        with:
          name: rivibe-pwa-dist
          path: dist/

  build-android-apk:
    name: Build Android APK (Capacitor)
    needs: verify-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Rename APK Artifact
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/rivibe-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: rivibe-android-apk
          path: release-apk/rivibe-android.apk
      - name: Publish GitHub Release APK
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: release-apk/rivibe-android.apk
          generate_release_notes: true

  deploy-pages:
    name: Deploy Chrome-Installable PWA to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: verify-web
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rivibe-pwa-dist
          path: dist/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/
      - id: deployment
        uses: actions/deploy-pages@v4
