name: RiVibe CI, PWA Deploy & Android APK Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  verify-web:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm --prefix backend ci --prefer-offline --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_GITHUB_REPO_URL: https://github.com/${{ github.repository }}
      - run: npm --prefix backend run build
      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

  build-android-apk:
    name: Build Android APK (Capacitor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK (use pre-installed runner SDK)
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "build-tools;35.0.0" \
            "platforms;android-36"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true
      - name: Make gradlew executable
        run: chmod +x android/gradlew
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npx vite build
        env:
          VITE_GITHUB_REPO_URL: https://github.com/${{ github.repository }}
      - run: npx cap sync android
      - name: Run Android Unit Tests & Build Debug APK
        working-directory: android
        run: ./gradlew testDebugUnitTest assembleDebug --parallel --build-cache
      - name: Rename APK Artifact
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/rivibe-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: rivibe-android-apk
          path: release-apk/rivibe-android.apk

  publish-release:
    name: Publish GitHub Release APK
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && github.event_name == 'push')
    needs: [verify-web, build-android-apk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rivibe-android-apk
          path: release-apk/
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          name: ${{ github.ref_type == 'tag' && format('RiVibe {0}', github.ref_name) || 'RiVibe Latest Android APK' }}
          body: ${{ github.ref_type != 'tag' && format('Automated Android APK build from `{0}` (`{1}`). Download `rivibe-android.apk` below to install on Android.', github.ref_name, github.sha) || '' }}
          generate_release_notes: ${{ github.ref_type == 'tag' }}
          make_latest: 'true'
          files: release-apk/rivibe-android.apk

  deploy-pages:
    name: Deploy Chrome-Installable PWA to GitHub Pages
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: verify-web
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
